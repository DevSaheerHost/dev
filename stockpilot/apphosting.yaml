# Firebase App Hosting configuration (runs the Next.js server on Cloud Run).
# Create secrets with:  firebase apphosting:secrets:set <NAME>
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  memoryMiB: 1024

env:
  # Public Firebase web config (Project settings → General → Your apps).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: your-web-api-key
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: your-project.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: your-project
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: your-app-id
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_APP_URL
    value: https://your-backend--your-project.us-central1.hosted.app
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_STORAGE_BUCKET
    value: your-project.firebasestorage.app
  # On App Hosting the Admin SDK uses the backend's service account automatically.
  - variable: AI_PROVIDER
    value: local
  - variable: GEMINI_API_KEY
    secret: geminiApiKey
  - variable: CRON_SECRET
    secret: cronSecret
  - variable: INTEGRATION_ENCRYPTION_KEY
    secret: integrationEncryptionKey
