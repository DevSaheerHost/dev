<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tiles</title>

    <link rel="stylesheet" href="/mytiles/styles.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <h1>MY TILES</h1>
    </header>


    <!-- TILES -->
    <section class="tiles">

        <!-- VIEW IMAGE -->
        <div class="tile" onclick="viewImage()">

            <div class="icon image-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
            </div>

            <div class="info">
                <div class="title">
                    View Image
                </div>

                <div class="description">
                    Open and view saved image
                </div>
            </div>

            <div class="arrow">
                <svg viewBox="0 0 24 24">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </div>

        </div>


        <!-- HYPERLINK 1 -->
        <div class="tile" onclick="futureFeature()">

            <div class="icon link-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M10 13a5 5 0 0 0 7 .1l2-2a5 5 0 0 0-7-7l-1 1"/>
                    <path d="M14 11a5 5 0 0 0-7-.1l-2 2a5 5 0 0 0 7 7l1-1"/>
                </svg>
            </div>

            <div class="info">
                <div class="title">
                    Hyperlink
                    <span class="future">FUTURE</span>
                </div>

                <div class="description">
                    This feature coming soon
                </div>
            </div>

            <div class="arrow">
                <svg viewBox="0 0 24 24">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </div>

        </div>


        <!-- HYPERLINK 2 -->
        <div class="tile" onclick="futureFeature()">

            <div class="icon link-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M10 13a5 5 0 0 0 7 .1l2-2a5 5 0 0 0-7-7l-1 1"/>
                    <path d="M14 11a5 5 0 0 0-7-.1l-2 2a5 5 0 0 0 7 7l1-1"/>
                </svg>
            </div>

            <div class="info">
                <div class="title">
                    Hyperlink
                    <span class="future">FUTURE</span>
                </div>

                <div class="description">
                    This feature coming soon
                </div>
            </div>

            <div class="arrow">
                <svg viewBox="0 0 24 24">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </div>

        </div>

    </section>


    <!-- TOAST -->
    <div id="toast" class="toast">
        <span class="toast-icon" id="icon">✓</span>
        <span id="toastMessage">Saved successfully</span>
    </div>


    <script src="/mytiles/script.js"></script>

</body>
</html>
