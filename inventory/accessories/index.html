<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Smart Accessories Finder</title>
<style>
:root{--bg:#0e0c14;--p:#1a1626;--p2:#292240;--ac:#8b5cf6;--g:#39ff14;--t:#ece9f5;--m:#9a93b0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
nav{display:flex;gap:6px;padding:10px;background:var(--p);overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{display:inline-flex;align-items:center;gap:7px}
nav button svg{width:19px;height:19px;flex:0 0 auto}
nav b{color:var(--ac);padding:8px 6px;white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--p2);border:1px solid #3a3150;border-radius:10px;padding:8px 10px;min-width:0}
button{cursor:pointer}button.on,button.pri{background:var(--ac);border-color:var(--ac)}button.dng{border-color:#a33}
.pn{background:var(--p);border-radius:14px;padding:12px;margin:8px}
.demo{background:#231c3a;border:1px solid #3a3150;border-left:3px solid var(--ac);
 border-radius:10px;padding:10px 12px;margin:0 0 8px;font-size:13px;line-height:1.5;color:var(--m)}
.demo b{color:var(--t)}
.lnk{background:none;border:0;padding:0;min-height:0;color:var(--ac);
 text-decoration:underline;font:inherit;cursor:pointer}
/* Icon buttons. A square target, never smaller than a fingertip, with the
   meaning in aria-label and title rather than in a word that wraps the
   toolbar onto a fourth row. */
.ib{width:44px;height:44px;padding:0;display:inline-grid;place-items:center;flex:0 0 auto}
.ib svg{width:21px;height:21px;display:block}
.ib.on{background:var(--ac);border-color:var(--ac)}
.ib.dng{border-color:#a33;color:#ff9a9a}
.ib.ok:not(:disabled){background:var(--g);border-color:var(--g);color:#06220a}
button:disabled{opacity:.42;cursor:not-allowed}
.tools{align-items:center}
.gr{flex:1 1 auto;min-width:0}
.sp{flex:1 1 auto;min-width:4px}
.ctx{align-items:center;gap:6px}
.ctx .m{margin-right:auto}
.g3{display:grid;grid-template-columns:300px 1fr 280px;gap:0;height:calc(100vh - 56px)}
.col{overflow:auto}.vw{position:relative;overflow:hidden;background:#000;touch-action:none;border-radius:14px;margin:8px;height:calc(100vh - 170px);min-height:300px}.ge{grid-template-columns:1fr 320px}
.st{position:absolute;left:0;top:0;transform-origin:0 0}
/* The camera move when you pick an item. Opt-in with .gl so a finger
   dragging the photo still tracks it exactly — a transition on every
   frame of a pan makes the photo lag behind the thumb. */
.st.gl{transition:transform .5s cubic-bezier(.22,.61,.36,1)}
.st svg [data-id].hit{animation:hit .6s ease-out}
@keyframes hit{0%{stroke-opacity:0;fill-opacity:0}
  35%{stroke-opacity:1;fill-opacity:.55}
  100%{stroke-opacity:1}}
@media(prefers-reduced-motion:reduce){.st.gl{transition:none}
  .st svg [data-id].hit,.st svg .dim{animation:none}}.st img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}.st svg{position:absolute;inset:0;width:100%;height:100%}
/* Overlay strokes stay the same size on screen at any zoom.
   The stage is zoomed with a CSS transform, so a stroke that is constant
   inside the SVG is still multiplied by that transform on the way to the
   display: at 3x, the 26px resize handles came out ~80px and swallowed the
   box they were meant to resize. Dividing by the live scale cancels it.
   The handles are deliberately larger on a touch screen than under a mouse,
   and because the hit area is the drawn stroke, they stay grabbable when
   zoomed out as well as sane when zoomed in. */
.st svg [data-h]{stroke-width:calc(var(--hs,18px)/var(--k,1))}
.st svg [data-id]{stroke-width:calc(2.5px/var(--k,1))}
.st svg [data-id].on{stroke-width:calc(4px/var(--k,1))}
.st svg .dim{animation:dim .45s ease-out}
@keyframes dim{from{fill-opacity:0}}
.st svg [data-s="dot"]{stroke-width:calc(var(--ds,10px)/var(--k,1))}
.st svg [data-s="line"]{stroke-width:calc(2px/var(--k,1))}
.st svg [data-s="dash"]{stroke-width:calc(1.5px/var(--k,1));stroke-dasharray:calc(6px/var(--k,1))}
@media(pointer:coarse){.st svg{--hs:26px;--ds:14px}}
.cap{position:absolute;left:10px;top:10px;background:rgba(14,12,20,.85);border:1px solid var(--g);color:var(--g);padding:4px 10px;border-radius:10px;font-weight:600;display:none}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>input,.row>select{flex:1}
.item{padding:8px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.item:hover,.item.on{background:var(--p2)}
.m{color:var(--m);font-size:12px}.bd{padding:1px 8px;border-radius:9px;background:#14532d;font-size:12px}.bd.lo{background:#7f1d1d}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #2c2540;text-align:left}.tw{overflow-x:auto}
.warn{background:#5a3b05;border-radius:10px;padding:8px;margin:6px 0}
dialog{background:var(--p);color:var(--t);border:1px solid var(--ac);border-radius:14px;width:min(440px,94vw)}dialog label{display:block;margin:6px 0}dialog input{width:100%}
@media(max-width:900px){nav{position:fixed;top:auto;bottom:0;left:0;right:0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid #3a3150}nav b{display:none}nav button{flex:1;padding:7px 2px;flex-direction:column;gap:3px}
 nav button span{font-size:11px;line-height:1.2}
 nav button svg{width:21px;height:21px}main{display:block;padding-bottom:84px}.g3{display:flex;flex-direction:column;height:auto}.ge{display:block}#fs{display:contents}#q{order:0;margin:8px;width:calc(100% - 16px)!important}#fm{order:1}#fd{order:2}#fl{order:3;margin:8px}.vw{height:52vh}button,select,input{min-height:42px}}
</style></head><body>
<nav><b>Smart Accessories Finder</b><button data-a="tab" data-v="find" aria-label="Find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg><span>Find</span></button><button data-a="tab" data-v="inv" aria-label="Inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8.2 12 3.3 3 8.2v7.6l9 4.9 9-4.9z"/><path d="m3 8.2 9 4.9 9-4.9M12 13.1V21"/></svg><span>Inventory</span></button><button data-a="tab" data-v="ed" aria-label="Store Editor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"/><path d="m14.5 13.5 6.2-6.2a1.9 1.9 0 0 0-2.7-2.7l-6.2 6.2-.6 3.3z"/></svg><span>Store Editor</span></button></nav>
<main id="app"></main><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db={products:[],racks:[],photos:[],maps:[]};const S={tab:'find',sel:null,q:'',ph:null,ms:null,tool:'pan',draft:[],undo:[],redo:[]},LOW=5;
const idb=new Promise(r=>{try{const q=indexedDB.open('saf',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function load(){const d=await idb;if(!d)return;return new Promise(r=>{const g=d.transaction('k').objectStore('k').get('db');g.onsuccess=()=>{if(g.result)db=g.result;r()};g.onerror=()=>r()})}
async function save(){const d=await idb;if(d)d.transaction('k','readwrite').objectStore('k').put(db,'db')}
const pd=p=>'M'+p.map(a=>a[0].toFixed(4)+' '+a[1].toFixed(4)).join('L')+'Z',prod=id=>db.products.find(p=>p.id==id),rack=id=>db.racks.find(r=>r.id==id);
const phOf=vid=>db.photos.find(p=>p.versions.some(v=>v.id==vid)),src=ph=>ph.versions.find(v=>v.id==ph.active).src;
function locs(pid){return db.maps.filter(m=>m.productId==pid).map(m=>{const ph=phOf(m.versionId);return ph&&ph.active==m.versionId?{m,ph}:null}).filter(Boolean)}
const lbl=l=>`${rack(l.ph.rackId)?.name||'?'} · Row ${l.m.row||'?'} · Slot ${l.m.slot||'?'}`;
function toks(s){return s.toLowerCase().split(/\s+/).filter(Boolean)}
function fz(h,t){if(h.includes(t))return 1;if(t.length<4)return 0;let i=0;for(const c of h)if(c==t[i])i++;return i==t.length}
function search(q){const t=toks(q);if(!t.length)return db.products.slice(0,60);return db.products.filter(p=>{const h=[p.name,p.sku,p.barcode,p.category,p.models,p.supplier].join(' ').toLowerCase();return t.every(x=>fz(h,x))}).slice(0,60)}
/* viewer: pan/zoom stage; overlay svg uses normalized 0..1 coords */
function Viewer(el){el.classList.add('vw');el.innerHTML='<div class="st"><img alt=""><svg viewBox="0 0 1 1" preserveAspectRatio="none"></svg></div><div class="cap"></div>';
const st=el.children[0],img=st.children[0],svg=st.children[1],cap=el.children[1];let k=1,x=0,y=0,ar=1,P=new Map(),d0=0;
let gt=0;
const ap=()=>{st.style.transform=`translate(${x}px,${y}px) scale(${k})`;st.style.setProperty('--k',k)},
/* Move there over half a second instead of teleporting. The class comes
   off at the end so the next pinch is immediate; a pointer landing
   mid-flight takes it off early and the photo follows the finger. */
glide=()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches){ap();return}
 st.classList.add('gl');ap();clearTimeout(gt);gt=setTimeout(()=>st.classList.remove('gl'),520)},
stop=()=>{clearTimeout(gt);st.classList.remove('gl')},A=()=>[...P.values()],dist=()=>Math.hypot(A()[0][0]-A()[1][0],A()[0][1]-A()[1][1]);
const zoom=(f,cx,cy)=>{const r=el.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,n=Math.min(14,Math.max(.5,k*f));x=px-(px-x)*n/k;y=py-(py-y)*n/k;k=n;ap()};
const v={el,svg,cap,tool:'pan',down:null,move:null,up:null,
set(s,cb){const go=()=>{ar=img.naturalHeight/img.naturalWidth;v.fit();cb&&cb()};if(img.getAttribute('src')==s&&img.complete)go();else{img.onload=go;img.src=s}},
fit(soft){const w=el.clientWidth,h=el.clientHeight;let a=w,b=w*ar;if(b>h){b=h;a=h/ar}st.style.width=a+'px';st.style.height=b+'px';k=1;x=(w-a)/2;y=(h-b)/2;soft?glide():ap()},
focus(p){const X=p.map(a=>a[0]),Y=p.map(a=>a[1]),bw=Math.max(...X)-Math.min(...X),bh=Math.max(...Y)-Math.min(...Y),cx=(Math.max(...X)+Math.min(...X))/2,cy=(Math.max(...Y)+Math.min(...Y))/2,sw=st.offsetWidth,sh=st.offsetHeight;
k=Math.min(10,Math.max(1,Math.min(.5*el.clientWidth/(bw*sw||1),.5*el.clientHeight/(bh*sh||1))));x=el.clientWidth/2-k*cx*sw;y=el.clientHeight/2-k*cy*sh;glide()},
get view(){return{k,x,y}},
/* Put the photo back exactly where it was, with no animation: this is
   restoring a position, not travelling to a new one. */
setView(s){if(!s)return;k=s.k;x=s.x;y=s.y;ap()},
n(e){const r=svg.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]}};
el.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.15:.87,e.clientX,e.clientY)};
el.onpointerdown=e=>{stop();P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size==2){d0=dist();v.cancel&&v.cancel()}else if(v.tool!='pan'&&v.down)v.down(e)};
el.onpointermove=e=>{const p=P.get(e.pointerId);if(!p)return;if(P.size==2){p[0]=e.clientX;p[1]=e.clientY;const d=dist();zoom(d/d0,(A()[0][0]+A()[1][0])/2,(A()[0][1]+A()[1][1])/2);d0=d;return}
if(v.tool=='pan'||v.tool=='edit'){x+=e.clientX-p[0];y+=e.clientY-p[1];ap()}else v.move&&v.move(e);p[0]=e.clientX;p[1]=e.clientY};
el.onpointerup=el.onpointercancel=e=>{P.delete(e.pointerId);v.up&&v.up(e)};return v}
const pick=(cam,cb)=>{const i=document.createElement('input');i.type='file';i.accept='image/*';if(cam)i.capture='environment';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.src=URL.createObjectURL(f)};i.click()};

function pickMany(cb){
 const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;
 i.onchange=async()=>{
  const files=[...i.files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  const items=[];
  for(const f of files){
   try{
    const data=await new Promise((resolve,reject)=>{
     const im=new Image(),url=URL.createObjectURL(f);
     im.onload=()=>{
      const scale=Math.min(1,1800/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.85));
     };
     im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not read '+f.name))};
     im.src=url;
    });
    items.push({name:f.name.replace(/\.[^.]+$/,'')||'Shelf photo',src:data});
   }catch(err){console.warn(err)}
  }
  if(items.length)cb(items);
 };
 i.click();
}

/* ---------- FIND ---------- */
let FV;
function viewFind(){$('#app').innerHTML=`<div class="g3"><div id="fs" class="col pn" style="margin:8px">${db.products.some(p=>p.demo)?`<div class="demo">This is <b>sample data</b> so you can try it out. Tap a product below &mdash; the photo moves to where it sits on the shelf. Add your own in <b>Inventory</b> and <b>Store Editor</b>, then <button class="lnk" data-a="cleardemo">remove the sample</button>.</div>`:''}<input id="q" placeholder="Search name, model, SKU, barcode" style="width:100%" value="${esc(S.q)}"><div id="fl"></div></div><div id="fm"><div class="row" style="margin:8px 8px 0"><select id="rk"><option value="">Browse a rack photo…</option>${db.photos.map(p=>`<option value="${p.id}">${esc(rack(p.rackId)?.name)} – ${esc(p.name)}</option>`).join('')}</select><button data-a="foc">Focus on Item</button><button data-a="fit">Reset view</button></div><div id="fv"></div></div><div class="col pn" id="fd"></div></div>`;
FV=Viewer($('#fv'));FV.svg.onclick=e=>{const m=db.maps.find(m=>m.id==e.target.dataset.id);if(m&&m.productId){S.sel=m.productId;showProd()}};
$('#q').oninput=e=>{S.q=e.target.value;list()};$('#rk').onchange=e=>{const ph=db.photos.find(p=>p.id==e.target.value);if(ph)showPhoto(ph)};list();showProd(true);
/* With nothing picked the stage was a black rectangle, which says nothing
   about what this screen is for. Showing a rack straight away does. */
if(!S.sel&&db.photos.length){const ph=db.photos.find(p=>p.id==S.ph?.id)||db.photos[0];$('#rk').value=ph.id;showPhoto(ph)}}
function list(){const r=search(S.q);$('#fl').innerHTML=r.map(p=>{const l=locs(p.id)[0];return`<div class="item ${p.id==S.sel?'on':''}" data-a="pick" data-v="${p.id}"><div><b>${esc(p.name)}</b><div class="m">${esc(p.sku)} · ₹${esc(p.sell)}</div><div class="m">${l?lbl(l):'No mapped location'}</div></div><span class="bd ${p.qty<=LOW?'lo':''}">${p.qty}</span></div>`}).join('')||'<p class="m">No products found. Add some in Inventory.</p>'}
function shapesF(ph,hi){const ms=db.maps.filter(m=>m.versionId==ph.active);let s='';if(hi)s+=`<path class="dim" d="M0 0H1V1H0Z${pd(hi.poly)}" fill="#000" fill-opacity=".62" fill-rule="evenodd"/>`;
ms.forEach(m=>{const on=hi&&m.id==hi.id;if(hi&&!on)return;s+=`<path data-id="${m.id}" class="${on?'on hit':''}" d="${pd(m.poly)}" fill="${on?'rgba(57,255,20,.12)':'rgba(139,92,246,.15)'}" stroke="${on?'#39ff14':'#8b5cf6'}" stroke-width="${on?4:2}" vector-effect="non-scaling-stroke" ${on?'style="filter:drop-shadow(0 0 6px #39ff14)"':''}/>`});FV.svg.innerHTML=s}
function showPhoto(ph,hi,cb){S.ph=ph;FV.set(src(ph),()=>{shapesF(ph,hi);cb&&cb()});FV.cap.style.display='none'}
function showProd(init){const p=prod(S.sel),d=$('#fd');if(!p){d.innerHTML='<p class="m">Select a product to see its location on the shop photo.</p>';return}
const L=locs(p.id);S.L=L;S.li=S.li||0;if(S.li>=L.length)S.li=0;list();
d.innerHTML=`<h3 style="margin:0">${esc(p.name)}</h3><div class="m">SKU ${esc(p.sku)}${p.barcode?' · '+esc(p.barcode):''}</div><p>₹${esc(p.sell)} · <span class="bd ${p.qty<=LOW?'lo':''}">${p.qty} in stock${p.qty<=LOW?' (low)':''}</span></p><div class="m">${esc(p.category)} · ${esc(p.models)}</div><p>${esc(p.description)}</p>
<b>Locations</b>${L.map((l,i)=>`<div class="row"><button class="${i==S.li?'on':''}" data-a="loc" data-v="${i}">${esc(lbl(l))}</button></div>`).join('')||'<div class="warn">Not mapped on any published photo yet.</div>'}
<div class="row"><button data-a="editp" data-v="${p.id}">Edit product</button><button data-a="toed" data-v="${p.id}">Open in editor</button></div>`;
if(L[S.li]){const l=L[S.li];showPhoto(l.ph,l.m,()=>{FV.focus(l.m.poly);FV.cap.textContent=lbl(l);FV.cap.style.display='block'})}}
/* ---------- INVENTORY ---------- */
const F=[['name','Name'],['sku','SKU'],['barcode','Barcode'],['category','Category'],['models','Compatible models'],['buy','Purchase price',1],['sell','Selling price',1],['qty','Quantity',1],['supplier','Supplier'],['description','Description']];
function viewInv(){const low=db.products.filter(p=>p.qty<=LOW).length;$('#app').innerHTML=`<div class="pn"><div class="row"><button class="pri" data-a="newp">+ Add product</button><button data-a="imp">Import CSV</button><button data-a="exp">Export CSV</button><button data-a="seed">Load demo data</button><button data-a="cleardemo">Remove demo data</button><span class="m">${db.products.length} products · ${low} low stock (≤${LOW})</span></div><div class="tw"><table><tr><th>Name</th><th>SKU</th><th>Category</th><th>₹ Sell</th><th>Qty</th><th>Location</th><th></th></tr>${db.products.map(p=>{const l=locs(p.id)[0];return`<tr><td>${esc(p.name)}${p.demo?' <span class="m">(demo)</span>':''}</td><td>${esc(p.sku)}</td><td>${esc(p.category)}</td><td>${esc(p.sell)}</td><td><span class="bd ${p.qty<=LOW?'lo':''}">${p.qty}</span></td><td class="m">${l?lbl(l):'–'}</td><td style="white-space:nowrap"><button data-a="adj" data-v="${p.id}" data-d="-1">−</button> <button data-a="adj" data-v="${p.id}" data-d="1">+</button> <button data-a="editp" data-v="${p.id}">Edit</button> <button class="dng" data-a="delp" data-v="${p.id}">Delete</button></td></tr>`}).join('')}</table></div></div>`}
function pform(id){const p=prod(id)||{};const d=$('#dlg');d.innerHTML=`<h3>${id?'Edit':'Add'} product</h3>${F.map(f=>`<label>${f[1]}<input name="${f[0]}" ${f[2]?'type="number" min="0" step="any"':''} value="${esc(p[f[0]]??'')}"></label>`).join('')}<div id="er" class="warn" style="display:none"></div><div class="row"><button class="pri" data-a="savep" data-v="${id||''}">Save</button><button data-a="close">Cancel</button></div>`;d.showModal()}
function savep(id){const o={};$('#dlg').querySelectorAll('input').forEach(i=>o[i.name]=i.value.trim());const er=m=>{const e=$('#er');e.textContent=m;e.style.display='block'};
if(!o.name||!o.sku)return er('Name and SKU are required.');if(db.products.some(p=>p.sku.toLowerCase()==o.sku.toLowerCase()&&p.id!=id))return er('Duplicate SKU.');
['buy','sell','qty'].forEach(k=>o[k]=Number(o[k])||0);const now=new Date().toISOString();if(id)Object.assign(prod(id),o,{updated:now});else{const n={id:uid(),created:now,updated:now,...o};db.products.push(n);S.newId=n.id}save();$('#dlg').close();render()}
function exportCsv(){const k=F.map(f=>f[0]),q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const t=[k.join(',')].concat(db.products.map(p=>k.map(c=>q(p[c])).join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='products.csv';a.click()}

/* ---------- DEMO ----------
   A visitor arriving at an empty app sees empty lists and no way to tell what
   it is for. The point of this app is the loop — search a product, see where
   it sits on a photo of the shelf — and that loop needs a photo with shapes
   on it before any of it means anything.

   So the demo is the whole loop, not three rows in a table: a rack, a picture
   of that rack, and products pinned onto it. The picture is drawn here rather
   than shipped as a file, so the page stays a single self-contained document
   and the shelves line up exactly with the shapes mapped onto them.        */

const DEMO_ITEMS=[
 /* name, sku, category, models, price, qty, shelf, slot, colour */
 ['Clear Case · iPhone 13','CASE-001','Cases','iPhone 13 Pro Max',499,12,0,0,'#9fd0ff'],
 ['Silicone Case · Galaxy S23','CASE-002','Cases','Galaxy S23',299,4,0,1,'#bba8ff'],
 ['USB-C Cable 1m','CBL-001','Cables','Universal',199,30,0,2,'#9affc8'],
 ['Fast Charger 33W','CHG-001','Chargers','Universal',899,7,1,0,'#ffd79a'],
 ['Earbuds · Bass','AUD-001','Audio','Universal',1299,3,1,1,'#ff9ab5'],
 ['Power Bank 10000mAh','PWR-001','Power',"Universal",1499,9,1,2,'#9fe8ff'],
 ['Tempered Glass · Redmi','GLS-001','Screen','Redmi Note 12',149,22,2,0,'#d6d6d6'],
 ['Car Mount · Magnetic','MNT-001','Mounts','Universal',599,2,2,1,'#ffc49a'],

/* Where each box sits on the drawn photo, in 0..1 coordinates. The drawing
   below and these numbers are generated from the same grid, so a shape can
   never drift off the box it labels. */
const DEMO_COLS=3,DEMO_ROWS=3,DEMO_PAD=.06,DEMO_GAP=.035;
function demoBox(shelf,slot){
 const w=(1-DEMO_PAD*2-DEMO_GAP*(DEMO_COLS-1))/DEMO_COLS,
       h=(1-DEMO_PAD*2-DEMO_GAP*(DEMO_ROWS-1))/DEMO_ROWS,
       x=DEMO_PAD+slot*(w+DEMO_GAP),y=DEMO_PAD+shelf*(h+DEMO_GAP);
 return{x,y,w,h};
}
function demoPoly(shelf,slot){const b=demoBox(shelf,slot);
 return[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]].map(p=>[+p[0].toFixed(4),+p[1].toFixed(4)])}

function demoPhoto(){
 const W=900,H=1200,c=document.createElement('canvas');c.width=W;c.height=H;
 const g=c.getContext('2d');
 g.fillStyle='#2b2118';g.fillRect(0,0,W,H);
 /* the unit itself, so it reads as a shelf rather than a grid of swatches */
 g.fillStyle='#7c2b2b';g.fillRect(W*.02,H*.02,W*.96,H*.96);
 g.fillStyle='#1d1612';g.fillRect(W*.045,H*.04,W*.91,H*.92);
 for(let shelf=0;shelf<DEMO_ROWS;shelf++){
  const b=demoBox(shelf,0);
  g.fillStyle='#8c3434';
  g.fillRect(W*.03,(b.y+b.h+DEMO_GAP*.25)*H,W*.94,H*.012);
 }
 DEMO_ITEMS.forEach(it=>{
  const b=demoBox(it[6],it[7]),x=b.x*W,y=b.y*H,w=b.w*W,h=b.h*H;
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x+6,y+8,w,h);
  g.fillStyle=it[8];g.fillRect(x,y,w,h);
  g.fillStyle='rgba(255,255,255,.75)';g.fillRect(x+w*.08,y+h*.1,w*.84,h*.42);
  g.fillStyle='#1d1612';
  g.font='600 '+Math.round(w*.1)+'px system-ui,sans-serif';
  g.textBaseline='top';
  it[0].split('·')[0].trim().split(' ').slice(0,2).forEach((word,i)=>
   g.fillText(word,x+w*.12,y+h*.6+i*w*.12,w*.78));
 });
 g.fillStyle='rgba(255,255,255,.5)';
 g.font='500 22px system-ui,sans-serif';
 g.fillText('SAMPLE RACK — demo data',W*.05,H*.955);
 return c.toDataURL('image/jpeg',.82);
}

  const created=[];
  items.forEach(item=>{
   const vid=uid(),id=uid();
   db.photos.push({id,rackId:rid,name:item.name,active:vid,versions:[{id:vid,src:item.src,at:Date.now()}]});
   created.push(id);
  });
  S.er=rid;S.edPh=created[0]||S.edPh;S.ms=null;S.draft=[];
  save();render();
  alert(`Added ${created.length} photo(s) to ${rack(rid)?.name||'the rack'}.`);
 });
},

addph:v=>{if(!db.racks.length)return alert('Add a rack first.');let rid=S.er;if(!rid){if(db.racks.length==1)rid=db.racks[0].id;else{const rn=prompt('Rack name for this photo:\n'+db.racks.map(r=>r.name).join(', '));rid=db.racks.find(r=>r.name==rn)?.id;if(!rid)return}}const name=prompt('Photo/angle name','Front view');if(!name)return;pick(v=='1',s=>{const vid=uid(),id=uid();db.photos.push({id,rackId:rid,name,active:vid,versions:[{id:vid,src:s,at:Date.now()}]});S.edPh=id;save();render()})},
tool:v=>{S.tool=v;S.draft=[];S.rc=null;refresh()},fin:()=>{if(S.draft.length>=3)addMap(S.draft);else alert('Click at least 3 points on the photo first.')},
undo:()=>{if(S.draft.length){S.draft.pop();render();return}if(S.undo.length){S.redo.push(JSON.stringify(db.maps));db.maps=JSON.parse(S.undo.pop());save();drawEd()}},redo:()=>{if(S.redo.length){S.undo.push(JSON.stringify(db.maps));db.maps=JSON.parse(S.redo.pop());save();drawEd()}},
delmap:()=>{if(confirm('Delete this shape? The product itself is kept.')){pushU();db.maps=db.maps.filter(m=>m.id!=S.ms);S.ms=null;save();render()}},
desel:()=>{S.ms=null;refresh()},
cleardemo:()=>clearDemo(),
/* Drop the last point of a polygon still being drawn. Undo works on saved
   shapes, so before this there was no way back from a mis-tap except
   starting the shape again. */
undopt:()=>{if(S.draft.length){S.draft.pop();refresh()}},
cancel:()=>{S.draft=[];refresh()},
newprodmap:()=>{S.after=1;pform()},mv:v=>{const[a,b]=v.split(',').map(Number);changeMap(m=>m.poly=m.poly.map(p=>[cl(p[0]+a*.004),cl(p[1]+b*.004)]))},rs:v=>{const[a,b]=v.split(',').map(Number);changeMap(m=>{const[x0,y0,x1,y1]=bb(m.poly);setRect(m,x0-a*.003,y0-b*.003,x1+a*.003,y1+b*.003)})},
restore:v=>{const ph=cur();ph.active=v;S.ms=null;save();render();loadImg()},
newver:v=>{const ph=cur(),cp=$('#cp').checked;pick(v=='1',s=>{const vid=uid(),old=ph.active;ph.versions.push({id:vid,src:s,at:Date.now()});if(cp)db.maps.filter(m=>m.versionId==old).forEach(m=>db.maps.push({...JSON.parse(JSON.stringify(m)),id:uid(),versionId:vid}));ph.active=vid;S.ms=null;save();render();loadImg()})}};
document.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v,b)};
document.onchange=e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value;
if(c=='erack'){S.er=v;S.edPh=db.photos.find(p=>!v||p.rackId==v)?.id;render()}else if(c=='eph'){S.edPh=v;S.ms=null;render()}
else if(c=='mprod')changeMap(m=>m.productId=v);else if(c=='mrow')changeMap(m=>m.row=v);else if(c=='mslot')changeMap(m=>m.slot=v)};
const _sp=savep;savep=function(id){_sp(id);if(S.after&&S.newId){const nid=S.newId;S.after=0;S.newId=null;if($('#es'))changeMap(m=>m.productId=nid)}};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.tab));({find:viewFind,inv:viewInv,ed:viewEd})[S.tab]()}
/* Keyboard, for the editor on a desktop. Delete removes the selected shape,
   Escape backs out of a polygon still being drawn and otherwise deselects.
   Ignored while typing, so Backspace in a text box still edits the text. */
addEventListener('keydown',e=>{
  if(S.tab!='ed')return;
  const t=e.target,tag=t&&t.tagName;
  if(tag=='INPUT'||tag=='TEXTAREA'||tag=='SELECT'||(t&&t.isContentEditable))return;
  if(e.key=='Escape'){if(S.draft.length){A.cancel()}else if(S.ms){A.desel()}else return;e.preventDefault();return}
  if(e.key=='Enter'&&S.draft.length>=3){A.fin();e.preventDefault();return}
  if(e.key=='Delete'||e.key=='Backspace'){
    if(S.draft.length){A.undopt();e.preventDefault();return}
    if(S.ms){A.delmap();e.preventDefault()}
  }
});
load().then(()=>{maybeSeed();render()});
