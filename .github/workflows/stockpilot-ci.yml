name: StockPilot CI

on:
  push:
    paths: ["stockpilot/**", ".github/workflows/stockpilot-ci.yml"]
  pull_request:
    paths: ["stockpilot/**", ".github/workflows/stockpilot-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stockpilot
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stockpilot/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
        env:
          DATABASE_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
