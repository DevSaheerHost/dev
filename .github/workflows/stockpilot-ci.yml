name: StockPilot CI

on:
  push:
    paths: ["stockpilot/**", ".github/workflows/stockpilot-ci.yml"]
  pull_request:
    paths: ["stockpilot/**", ".github/workflows/stockpilot-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stockpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stockpilot/package-lock.json
      # The Firebase emulators need Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:firebase
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
