<!--
  The Android status-bar icon.

  Android draws a notification's small icon as a silhouette: every pixel is
  forced to white and only the alpha channel survives, so this is a shape, not
  a picture. Drawing it in colour is the usual way to end up with a white
  square in the status bar.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <g fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linejoin="round">
    <rect x="42" y="26" width="108" height="140" rx="18"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="64" y="60" width="64" height="12" rx="6"/>
    <rect x="64" y="90" width="64" height="12" rx="6"/>
    <rect x="64" y="120" width="40" height="12" rx="6"/>
  </g>
</svg>
