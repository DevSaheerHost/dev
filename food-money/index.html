<body>
  <main>
    <header>
      <div>
        <h1>Food Money</h1>
        <p>Daily payment tracker</p>
      </div>
<span><i class="fa-solid fa-wallet"></i>
</span>    </header>



<div class="card">
  <div class="date-wrap">
    <span id="prevMonth">
      <i class="fa-solid fa-angle-left"></i>
    </span>
    <div>
      <h3 id="monthTitle">October 2026</h3>
      <p>Monthly Calander</p>
    </div>
    <span id="nextMonth">
      <i class="fa-solid fa-angle-right"></i>
    </span>
  </div>
  
  <div class="chips">
    <div class="chip expected">
      <p>Expected</p>
      <p class="amount">₹1,550</p>
    </div>
    <div class="chip received">
      <p>Expected</p>
      <p class="amount">₹1,000</p>
    </div>
    <div class="chip pending">
      <p>Expected</p>
      <p class="amount">₹550</p>
    </div>
  </div>
  
  
  <section class="calendar">
    <div class="calendar-weekdays">
      <div>
        Mon
      </div>
      <div>
        Tue
      </div>
      <div>
        Wed 
      </div>
      <div>
        Thu
      </div>
      <div>
        Fri
      </div>
      <div>
        Sat
      </div>
      <div>
        Sun 
      </div>
    </div>
    
    <div class="calendar-grid" id="calendarGrid">
      <!-- Keep it empty -->
    </div>
  </section>
</div>
  </main>
  
  
  <script src="./main.js"></script>
