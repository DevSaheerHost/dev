<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Money</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
  <main>
    <header>
      <div>
        <h2>Food Money</h2>
        <p>Daily payment tracker</p>
      </div>
<span><i class="fa-solid fa-wallet"></i>
</span>    </header>



<div class="card">
  <div class="date-wrap">
    <span id="prevMonth">
      <i class="fa-solid fa-angle-left"></i>
    </span>
    <div>
      <h3 id="monthTitle">October 2026</h3>
      <p>Monthly Calander</p>
    </div>
    <span id="nextMonth">
      <i class="fa-solid fa-angle-right"></i>
    </span>
  </div>
  
  <div class="chips">
    <div class="chip expected">
      <p>Expected</p>
      <p class="amount">₹1,550</p>
    </div>
    <div class="chip received">
      <p>Expected</p>
      <p class="amount">₹1,000</p>
    </div>
    <div class="chip pending">
      <p>Expected</p>
      <p class="amount">₹550</p>
    </div>
  </div>
  
  
  <section class="calendar">
    <div class="calendar-weekdays">
      <div>
        Mon
      </div>
      <div>
        Tue
      </div>
      <div>
        Wed 
      </div>
      <div>
        Thu
      </div>
      <div>
        Fri
      </div>
      <div>
        Sat
      </div>
      <div>
        Sun 
      </div>
    </div>
    
    <div class="calendar-grid" id="calendarGrid">
      <!-- Keep it empty -->
    </div>
  </section>
</div>
  </main>
  
  
  <script src="./main.js"></script>
</body>

</html>
